[settings]
max_content_size = 80000

[telemetry.tracing]
enable = true
level = "info"
address = "http://otlp-collector:4317"

[telemetry.logger]
level = "info"
attributes = []

[telemetry.logger.loki]
enable = true
address = "http://loki:3100"

[telemetry.logger.syslog]
enable = false
address = "udp://syslog-server:514"

[server.http]
address = "0.0.0.0:2892"

[storage.opensearch]
address = "http://opensearch:9200"
username = "admin"
password = "admin"

[storage.opensearch.cluster]
number_of_shards = 1
number_of_replicas = 1

[storage.opensearch.semantic]
model_id = "uPRh30JcBW8Qg3Gf4I6K"
knn_ef_searcher = 100
knn_dimension = 768
token_limit = 700
overlap_rate = 0.2

[storage.vllm]
enable = true
base_url = "http://embeddings-server:8074/v1"
api_key = ""
model = "Qwen/Qwen3-Embedding-0.6B"
overlap = 0.2
dimension = 1024
retries = 3
timeout = 5
top_n = 10

[cache]
is_enabled = false

[cache.redis]
address = "redis://redis:6379"
username = "redis"
password = "redis"
expired = 3600

[services.resource_manager]
base_url = "http://resource-manager:2899"
timeout = 5
